<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 실패 · 크레온에듀</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css">
</head>
<body>
<header class="hd">
  <a class="brand" href="./"><span class="logo">C</span><span class="brand-t"><b>크레온에듀 교재몰</b><small>CREON EDU · 공식 교재 구매</small></span></a>
</header>
<main class="wrap">
  <div class="result">
    <div class="icon">😥</div>
    <h1>결제가 완료되지 않았습니다</h1>
    <p class="lead" id="msg">결제가 취소되었거나 오류가 발생했습니다. 요금은 청구되지 않았습니다.</p>
    <section class="card"><dl class="kv" id="kv"></dl></section>
    <div class="actions">
      <a class="btn btn-g" href="./">교재 목록</a>
      <a class="btn btn-p" href="./#checkout">다시 결제하기</a>
    </div>
  </div>
</main>
<footer class="ft" id="footer"></footer>
<script src="products.js"></script>
<script src="common.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  if (q.get('message')) $('msg').textContent = q.get('message');
  $('kv').innerHTML = [['주문번호', q.get('orderId')], ['오류 코드', q.get('code')], ['고객센터', SHOP.company.phone]]
    .filter(function (r) { return r[1]; })
    .map(function (r) { return '<div><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>'; }).join('');
})();
</script>
</body>
</html>
