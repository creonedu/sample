
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}

.tc{text-align:center}.tn{text-align:center;font-weight:700;color:#1A2B5E}.ts{text-align:center;font-weight:700;color:#E55C20}
.pf{background:var(--color-background-secondary);padding:1px 5px;border-radius:3px;font-weight:700;color:#1A2B5E;font-size:10px}
.pt{background:#1A2B5E;color:#fff;padding:1px 5px;border-radius:3px;font-weight:700;font-size:10px}

.empty-i{font-size:32px;margin-bottom:10px}

@media(max-width:700px){
  .fg{grid-template-columns:1fr 1fr}.fi.s2,.fi.sf{grid-column:1/-1}

}

  @page{size:A4 portrait;margin:13mm 16mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

      </div>

<script>
var D=null,SI=null;
var LN=['Mega','Giga','Tera','Bridge','Par','Birdie','Eagle','Alba','Alba+','Master 1','Global Masters'];
var LI={};LN.forEach(function(l,i){LI[l]=i;});
var GR=['초4','초5','초6','중1','중2','중3'];
var AG=['초4','초5','초6','중1','중2','중3','고1','고2','고3'];
var SO=['봄','여름','가을','겨울'];
var SSC={봄:'spring',여름:'summer',가을:'fall',겨울:'winter'};
var SF={봄:'봄(3~5월)',여름:'여름(6~8월)',가을:'가을(9~11월)',겨울:'겨울(12~2월)'};
var SE={spring:'🌸',summer:'☀️',fall:'🍂',winter:'❄️'};
var SM={spring:'봄 (3~5월)',summer:'여름 (6~8월)',fall:'가을 (9~11월)',winter:'겨울 (12~2월)'};
var GC={'중1':'#0D9065','중2':'#0891B2','중3':'#7C3AED','고1':'#D97706','고2':'#DC2626','고3':'#E55C20','초4':'#64748B','초5':'#475569','초6':'#334155'};

function gf(id){return document.getElementById(id);}
function gT(i){document.querySelectorAll('.tab').forEach(function(b,n){b.classList.toggle('on',n===i)});document.querySelectorAll('.panel').forEach(function(p,n){p.classList.toggle('on',n===i)});}
function getData(){return{name:gf('fn').value.trim()||'학생',school:gf('fsc').value.trim()||'',grade:gf('fgr').value,sem:gf('fsm').value,level:gf('flv').value,tiBT:gf('ft').value||'미응시',tJr:gf('ftj').value||'미응시',elv:gf('fel').value,interests:gf('fint').value||'미기재',hs:gf('fhs').value,uni:gf('fu').value||'미정',major:gf('fm').value||'미정',notes:gf('fnt').value||''};}
function doReset(){['fn','fsc','ft','ftj','fint','fu','fm','fnt'].forEach(function(id){gf(id).value='';});gf('fgr').value='중1';gf('fsm').value='봄';gf('flv').value='Bridge';gf('fel').value='중급';gf('fhs').value='일반고(특구)';}
function setForm(d){if(!d)return;var M={name:'fn',school:'fsc',grade:'fgr',sem:'fsm',level:'flv',elv:'fel',interests:'fint',hs:'fhs',uni:'fu',major:'fm',notes:'fnt'};Object.keys(M).forEach(function(k){if(d[k]&&d[k]!=='미응시'&&d[k]!=='학생'){try{gf(M[k]).value=d[k];}catch(e){}}});if(d.tiBT&&d.tiBT!=='미응시')gf('ft').value=d.tiBT;if(d.tJr&&d.tJr!=='미응시')gf('ftj').value=d.tJr;}
async function doSave(){try{await window.storage.set('cv2_si',JSON.stringify(SI));await window.storage.set('cv2_d',JSON.stringify(D));var s=gf('sv');s.style.display='block';setTimeout(function(){s.style.display='none';},2000);}catch(e){}}
async function doLoad(){try{var ri=await window.storage.get('cv2_si');if(ri){SI=JSON.parse(ri.value);setForm(SI);}}catch(e){}try{var rd=await window.storage.get('cv2_d');if(rd){D=JSON.parse(rd.value);renderAll();}}catch(e){}}

/* ── TRACK ── */
function getTrack(hs){if(/외고|국제고|전국자사고/.test(hs))return'GT';if(/광역자사고|과학고|영재/.test(hs))return'ST';return'NT';}
var TF={GT:'Global Masters',ST:'Master 1',NT:'Eagle'};
var TN={GT:'GT [Global Track]',ST:'ST [Special Track]',NT:'NT [National Track]'};

/* ── SEMESTER LIST ── */
function getSems(grade,sem){var r=[];var gi=GR.indexOf(grade);if(gi<0)gi=3;var si=SO.indexOf(sem);if(si<0)si=0;for(var g=gi;g<GR.length;g++){for(var s=(g===gi?si:0);s<SO.length;s++){r.push({grade:GR[g],sem:SO[s]});}}return r;}

/* ── COURSES ── */
var CRS={
  GT:{Mega:['April','CR+CTP'],Giga:['April','CR+CTP'],Tera:['CDI','CR+CTP'],'Bridge':['CDI','ESL+Master'],'Par':['CDI','ESL+Master'],'Birdie':['CDI','TO+Master'],'Eagle':['CDI','TO+Master'],'Alba':['CDI','Master'],'Alba+':['CDI','Master'],'Master 1':['CDI','Global Masters'],'Global Masters':['CDI','Global Masters']},
  ST:{Mega:['April','Sapling'],Giga:['April','Sapling'],Tera:['CDI','ESL+CTP'],'Bridge':['CDI','ESL+TO'],'Par':['CDI','ESL+TO'],'Birdie':['CDI','TO'],'Eagle':['CDI','TO'],'Alba':['CDI','EFL내신'],'Alba+':['CDI','고등S반'],'Master 1':['CDI','고등S반'],'Global Masters':['CDI','고등S반']},
  NT:{Mega:['April','Sprout'],Giga:['April','Sprout'],Tera:['CDI','ESL+CR'],'Bridge':['CDI','ESL+CTP/TO'],'Par':['CDI','EFL'],'Birdie':['CDI','EFL'],'Eagle':['CDI','EFL내신'],'Alba':['CDI','고등A반'],'Alba+':['CDI','고등A반'],'Master 1':['CDI','고등A반'],'Global Masters':['CDI','고등A반']}
};
function getCrs(tr,lv){return(CRS[tr]&&CRS[tr][lv])||['CDI','EFL'];}

/* ── SCORE ── */
function getScore(tr,lv,gr){
  var GT_S={'Tera':'TOEFL Jr. 600','Bridge':'TOEFL Jr. 650','Par':'TOEFL Jr. 750 / GE9','Birdie':'iBT 90점 / GE9','Eagle':'iBT 90~100점','Alba':'iBT 100~110점','Alba+':'iBT 110점','Master 1':'iBT 115점','Global Masters':'iBT 115점 / SAT 1400점'};

/* ── ENGLISH ROADMAP ── */
function genER(info){
  var tr=getTrack(info.hs);
  var sems=getSems(info.grade,info.sem);
  var n=sems.length;
  if(n===0)return[];
  var si=LI[info.level]!==undefined?LI[info.level]:3;
  var ei=LI[TF[tr]]!==undefined?LI[TF[tr]]:6;
  if(si>=ei)ei=Math.min(si+2,LN.length-1);
  var lev=ei-si;
  return sems.map(function(s,i){
    var cp=lev>0?Math.floor(i*lev/n):0;
    var tp=lev>0?Math.floor((i+1)*lev/n):0;
    var ci=Math.min(si+cp,ei);
    var ti=Math.min(si+tp,ei);
    return{grade:s.grade,semester:SF[s.sem],sc:SSC[s.sem],curLv:LN[ci],tgtLv:LN[ti],courses:getCrs(tr,LN[ci]),score:getScore(tr,LN[ti],s.grade),vocab:getVoc(s.grade,s.sem),focus:getFoc(tr,LN[ci])};
  });
}
