<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 실패 · Studyfy</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hd"><div class="nav">
  <a class="brand" href="./"><span class="mark">S</span><b>Studyfy</b></a>
</div></header>
<main>
  <div class="result">
    <div class="icon warn">!</div>
    <h1>결제가 완료되지 않았습니다</h1>
    <p class="lead" id="msg">결제가 취소되었거나 오류가 발생했습니다.</p>
    <section class="card"><dl class="kv" id="kv"></dl></section>
    <div class="actions">
      <a class="btn btn-g" href="./#consult">상담 문의</a>
      <a class="btn btn-p" id="retry" href="./#programs">다시 결제하기</a>
    </div>
  </div>
</main>
<footer class="ft" id="footer"></footer>
<script src="programs.js"></script>
<script src="common.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var order = readJSON('sessionStorage', ORDER_KEY, null);
  if (q.get('message')) $('msg').textContent = q.get('message');
  if (order && order.programId) $('retry').href = './#enroll=' + encodeURIComponent(order.programId);
  $('kv').innerHTML = [['주문번호', q.get('orderId')], ['오류 코드', q.get('code')], ['고객센터', SF.company.phone]]
    .filter(function (r) { return r[1]; })
    .map(function (r) { return '<div><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>'; }).join('');
})();
</script>
</body>
</html>
