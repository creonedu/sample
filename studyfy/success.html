<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수강신청 완료 · Studyfy</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hd"><div class="nav">
  <a class="brand" href="./"><span class="mark">S</span><b>Studyfy</b></a>
</div></header>
<main>
  <div class="result" id="loading">
    <div class="spin"></div>
    <h1>결제를 확인하고 있습니다</h1>
    <p class="lead">창을 닫지 말고 잠시만 기다려주세요.</p>
  </div>
  <div class="result" id="done" hidden>
    <div class="icon">✓</div>
    <h1>수강신청이 완료되었습니다</h1>
    <p class="lead">1영업일 안에 담당 컨설턴트가 연락드려 첫 일정을 확정합니다.</p>
    <section class="card"><dl class="kv" id="doneKv"></dl></section>
    <div class="actions">
      <a class="btn btn-g" id="receipt" target="_blank" rel="noopener" hidden>영수증 보기</a>
      <a class="btn btn-p" href="./">홈으로</a>
    </div>
  </div>
  <div class="result" id="fail" hidden>
    <div class="icon warn">!</div>
    <h1>결제 승인에 실패했습니다</h1>
    <p class="lead" id="failMsg"></p>
    <section class="card"><dl class="kv" id="failKv"></dl></section>
    <div class="actions"><a class="btn btn-p" id="retry" href="./#programs">다시 신청하기</a></div>
  </div>
</main>
<footer class="ft" id="footer"></footer>
<script src="programs.js"></script>
<script src="common.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var paymentKey = q.get('paymentKey'), orderId = q.get('orderId'), amount = Number(q.get('amount'));
  var order = readJSON('sessionStorage', ORDER_KEY, null);
  function kv(id, rows) {
    $(id).innerHTML = rows.filter(function (r) { return r[1]; }).map(function (r) {
      return '<div><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>';
    }).join('');
  }
  function fail(msg, code) {
    $('loading').hidden = true; $('fail').hidden = false;
    $('failMsg').textContent = msg;
    if (order && order.programId) $('retry').href = './#enroll=' + encodeURIComponent(order.programId);
    kv('failKv', [['주문번호', orderId], ['오류 코드', code], ['문의', SF.company.phone]]);
  }
  if (!paymentKey || !orderId || !order || order.orderId !== orderId || order.amount !== amount) {
    return fail('신청 정보가 확인되지 않습니다. 결제는 승인되지 않았으니 처음부터 다시 신청해주세요.', 'ORDER_MISMATCH');
  }
  fetch('/api/studyfy-confirm', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ paymentKey: paymentKey, orderId: orderId, amount: amount, order: order })
  }).then(function (r) {
    return r.json().catch(function () { return { ok: false, message: '결제 승인 서버에 연결할 수 없습니다.', code: 'NO_SERVER_' + r.status }; });
  }).then(function (res) {
    if (!res.ok) return fail(res.message || '알 수 없는 오류가 발생했습니다.', res.code);
    removeKey('sessionStorage', ORDER_KEY);
    var p = findProgram(order.programId);
    $('loading').hidden = true; $('done').hidden = false;
    kv('doneKv', [
      ['주문번호', orderId], ['프로그램', p ? p.name : order.orderName], ['결제 금액', won(amount)],
      ['결제 수단', res.method], ['학생', order.customer.student + ' (' + order.customer.grade + ')'],
      ['연락처', order.customer.phone]
    ]);
    if (res.receiptUrl) { $('receipt').href = res.receiptUrl; $('receipt').hidden = false; }
  }).catch(function () {
    fail('결제 승인 서버에 연결할 수 없습니다. (사이트가 아직 배포되지 않은 미리보기 상태일 수 있습니다)', 'NETWORK');
  });
})();
</script>
</body>
</html>
